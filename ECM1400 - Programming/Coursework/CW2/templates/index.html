
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Othello Board</title>
    <style>
        html * {
            font-family: "Arial";
        }
        body {
            display: flex;
            flex-direction: column; /* Stack Title and Game Area vertically */
            align-items: center; /* Center everything horizontally */
            min-height: 100vh; /* Use full viewport height */
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center; /* Vertically align items in the middle */
            height: 70vh; /* Full height of the viewport */
        }
        .board_grid {
            display: grid;
            grid-template-columns: repeat({{game_board|length}}, 60px);
            grid-template-rows: repeat({{game_board|length}}, 60px);
            gap: 2px;
            background: #006400;
            padding: 10px;
            width: fit-content;
            margin: 0 40px 0 0;
            border-radius: 10px
        }
        .cell {
            width: 60px;
            height: 60px;
            background: #228B22;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .cell:hover {
            background: #dd0712;
        } 
        .piece {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        .black {
            background: #222;
        }
        .white {
            background: #fff;
            border: 1px solid #222;
        }
        #messageBox {
            display: flex;
            flex-direction: column;
            width: 300px;
            border: 1px solid black; 
            padding: 20px; 
            border-radius: 15px;
            align-self: stretch; 
            overflow-y: auto;
            margin: 10px 10px 10px 0;
        }
        #messageBoxContent {
            overflow-y: auto;
        }
        #game_area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
        }
        #utility_buttons {
            display: flex;
            justify-content: center;
            margin: 10px;
            height: 20%;
        }
        button {
            margin: 10px;
            height: 50px;
            width: 100px;
            font-size: 18px;
            border-radius: 10px;
        }
        button:hover {
            background-color: #228B22;
            color: white;
        }
        #fileInput {
            display: none;
        }
        #loadBtn {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            height: 50px;
            width: 100px;
            font-size: 18px;
            border-radius: 10px;
            background-color: #F0F0F0;
            border: 2px solid #222;
            box-sizing: border-box;
        }
        #loadBtn:hover {
            background-color: #228B22;
            color: white;
        }
        #ai_opponent_div {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            margin: 16px 0 0 0;
        }
    </style>
    <script>
        //Get the board that is passed from the python flask code
        let board = {{game_board|tojson}};
        //console.log(board);

        // Load the grid format once the page has loaded
        document.addEventListener('DOMContentLoaded', function() {
            loadBoard();
            updateMessageBox("It's Dark's turn.");
        }, false);

        // Change the height of the game log div to match the board's height
        //document.getElementById('messageBox').style.height = document.getElementById('board_grid').style.height;

        function sendAIMove() {
            // Send dummy coordinates to the server, indictaing that the AI is going to make a move
            fetch('/move?x=1&y=1', {
                method: 'GET',
            })
            .then(response => response.json())
            .then(data => {
                // Process the response
                if (data['status'] === 'success') {
                    // Indictae that the AI has made a move and where this move was
                    updateMessageBox('AI has placed a counter at (' + data['ai_coordinate'][0] + ', ' + data['ai_coordinate'][1] + ').<br>');
                    // Indicate that it is the next player's turn
                    updateMessageBox("It's " + data['next_player'] + "'s turn.");
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();
                }
                // If the ai move fails, indicate so
                else if (data['status'] === 'fail') {
                    // Indicate that the ai has failed to make a move
                    updateMessageBox('AI was unable to make a move.<br>');
                    // Indicate that it is the other player's turn
                    updateMessageBox("It's " + data['next_player'] + "'s turn.");
                }

                // Deals with the case where the game has ended
                else if (data['finished'] === true){
                    // Therefore, game is finished
                    // Set the title to game over
                    document.getElementById('messageBoxTitle').innerHTML = 'Game Over';
                    // Display the scores
                    document.getElementById('messageBoxContent').innerHTML = 'Dark scored ' + data['scores'][1] + ' points<br>AI scored ' + data['scores'][0] + ' points<br><br>';
                    // If the game has resulted in a draw, indicate so
                    if (data['winner'] === "draw") {
                        document.getElementById('messageBoxContent').innerHTML += 'It is a draw';
                    }
                    // Otherwise, indicate who is the winner
                    else if (data['winner'] === "Light") {
                        document.getElementById('messageBoxContent').innerHTML += 'AI is the winner!';
                    }
                    else {document.getElementById('messageBoxContent').innerHTML += data['winner'] + ' is the winner!';}
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();
                }
            })
            // Deals with if an error occurs
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function sendMove(x, y, url) {
            // Perform a GET request to the server with the x and y coordinates for the move
            // The server will respond with a JSON object containing whether the move was legal

            // Send the coordinates to the server
            fetch(url+'?x='+x+'&y='+y, {
                method: 'GET',
            })
            .then(response => response.json())
            .then(data => {
                // Deal with the case where the move was valid
                if (data['status'] === 'success'){
                    // Indicate that the move was valid
                    updateMessageBox('Valid move at (' + x + ', ' + y + ')<br>');
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();

                    // First, check if the data says the other player cannot make any legal moves
                    if (data['legal_moves_available_for_other_player'] === false) {
                        // Indicate that it is the other players turn
                        updateMessageBox("It's " + data['other_player'] + "'s turn.")
                        // Inform them that they have no legal moves available
                        updateMessageBox("No legal moves available for " + data['other_player'])
                        // Indicate that it is the current player's turn again, other player has skipped
                        updateMessageBox("It's " + data['current_player'] + "'s turn.")
                    }
                    else {
                        // Check if the AI is playing and it is the AI's turn
                        if (document.getElementById("ai_opponent_checkbox").checked && data['next_player'] === "Light") {
                            // Indicate that it is the AI's turn
                            updateMessageBox("It's the AI's turn.");
                            // Process the AI's move
                            sendAIMove()
                        }
                        // Otherwise, AI opponent is disabled
                        else {
                            updateMessageBox("It's " + data['next_player'] + "'s turn.");
                        }
                    }
                }
                
                // Deal with the case where the move has failed
                else if (data['status'] === 'fail'){
                    // Indicate that an illegal move was made and provide the coordinates
                    updateMessageBox('Illegal move at (' + x + ', ' + y + ')');
                }
                
                // Deal with the case where the other player has no available legal moves
                else if (data['status'] === 'no_legal_moves'){
                    // Inform the user that they do not have any legal moves
                    updateMessageBox("It's " + data['other_player'] + "'s turn.")
                    updateMessageBox('No legal moves available for ' + data['other_player'] + '<br>');

                    // Logic to switch to other player, taking into consideration if the AI opponent is enabled
                    if (data['current_player'] === 'Light') {
                        if (document.getElementById("ai_opponent_checkbox").checked === true) {updateMessageBox("It's the AI's turn.");}
                        else {updateMessageBox("It's Lights's turn.");}
                    }
                    else {updateMessageBox("It's Darks's turn.");}
                }
                
                // Deals with the case where the game has ended
                else if (data['finished'] === true){
                    // Therefore, game is finished
                    // Set the title to game over
                    document.getElementById('messageBoxTitle').innerHTML = 'Game Over';
                    // Display the scores
                    document.getElementById('messageBoxContent').innerHTML = 'Dark scored ' + data['scores'][1] + ' points<br>Light scored ' + data['scores'][0] + ' points<br><br>';
                    // If the game has resulted in a draw, indicate so
                    if (data['winner'] === "draw") {
                        document.getElementById('messageBoxContent').innerHTML += 'It is a draw';
                    }
                    // Otherwise, indicate who is the winner
                    else {document.getElementById('messageBoxContent').innerHTML += data['winner'] + ' is the winner!';}
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();
                }
            })
            // If an error occurs, display it in the console
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function loadBoard() {
            for (let y = 0; y < board.length; y++) {
                for (let x = 0; x < board[y].length; x++) {
                    let cell = document.getElementById(`cell-${x}-${y}`);
                    cell.innerHTML = ''; // Clear existing pieces
                    if (board[y][x] === 'Dark ') {
                        let piece = document.createElement('div');
                        piece.className = 'piece black';
                        cell.appendChild(piece);
                    } else if (board[y][x] === 'Light') {
                        let piece = document.createElement('div');
                        piece.className = 'piece white';
                        cell.appendChild(piece);
                    }
                }
            }
        }

        function updateMessageBox(message) {
            //let messageBox = document.getElementById('messageBox');
            let messageBoxContent = document.getElementById('messageBoxContent');
            messageBoxContent.innerHTML += message + '<br>';
            messageBoxContent.scrollTop = messageBoxContent.scrollHeight; // Auto-scroll to the bottom
        }

        function saveGameBoard(url) {
            // Formulate a new response object
            fetch(url, {
                method: "POST",
                headers: {"Content-Type": "text/plain"},
                body: document.getElementById('messageBoxContent').innerHTML
            })
            .then(response => response.blob())
            .then(blob => {
                // Create a temporary download link
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "reversi_game_board_save.json";   // name saved on user's machine
                document.body.appendChild(a);
                a.click();

                // Clean up
                a.remove();
                window.URL.revokeObjectURL(url);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        async function loadGameBoard() {
            // Get access to the file input element
            const input = document.getElementById('fileInput');

            // If the user has accidentally clicked load with no file selected,
            // then inform them that they need to select a file first
            if (input.files.length === 0) {
                alert("Please choose a file first!");
                return;
            }

            // Retrieve the first file they selected
            const file = input.files[0];
            // Allows us to send multi-part data
            const formData = new FormData();
            // Similar to a dictionary, "file" allows use to access the file
            formData.append("file", file);

            // Formulate a new response object
            const response = await fetch("/load_game_board", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Process the response
                if (data['status'] === 'success'){
                    if (data['game_over'] === true) {document.getElementById('messageBoxTitle').innerHTML = "Game Over"}
                    // Update the game log with the log of the game
                    document.getElementById('messageBoxContent').innerHTML = data['game_log'];
                    // Update the checked status of the ai opponent check box
                    document.getElementById('ai_opponent_checkbox').checked = data['ai_opponent_toggle'];
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();
                }
                
                else if (data['status'] === 'fail'){
                    // Update the game log box with the error message
                    document.getElementById('messageBoxContent').innerHTML = data['error_message'] + "<br>";
                }
            })
            .catch((error) => {
                console.error('Error:', error);
            });

            // Reset the file input value
            document.getElementById('fileInput').value = "";
        }

        function resetBoard(url) {
            fetch(url, {
                method: 'GET',
            })
            .then(response => response.json())
            .then(data => {
                // Process the response
                if (data['status'] === 'success'){
                    // Reset the game log box
                    document.getElementById('messageBoxTitle').innerHTML = 'Game Log';
                    document.getElementById('messageBoxContent').innerHTML = "It's Dark's turn. <br>";
                    // Reset the checkbox checked state
                    document.getElementById('ai_opponent_checkbox').checked = false;
                    // Call the toggleAIOpponent to tell the server that the AI opponent is now disabled
                    toggleAIOpponent()
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();
                }
                
                else if (data['status'] === 'fail'){
                    document.getElementById('messageBoxContent').innerHTML = "Unable to reset board.";
                }
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function toggleAIOpponent() {
            // Formulate a new response object
            fetch("/toggle_ai_opponent", {
                method: "POST",
                headers: {"Content-Type": "text/plain"},
                body: document.getElementById('ai_opponent_checkbox').checked
            })
            .then(response => response.json())
            .then(data => {
                // Check if the toggle was not a success
                if (data['status'] === 'fail'){
                    // Revert the checkbox state
                    document.getElementById('ai_opponent_checkbox').checked = false
                    // Inform the user that the ai opponent was not activated
                    alert("AI Opponent not activated!")
                }
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }
    </script>
</head>
<body>
    <div id="title">
        <h1 style="text-align:center;">Othello (Reversi) Game</h1>
    </div>
    
    <div id="game_area">
        <div id="board_grid" class="board_grid">
            {% for i in range(game_board|length) %}
                {% for j in range(game_board|length) %}
                    <div class="cell" id="cell-{{ j }}-{{ i }}" onclick="sendMove({{ j+1 }}, {{ i+1 }}, '/move')">
                        {% if game_board[i][j] == 'Dark ' %}
                            <div class="piece black"></div>
                        {% elif game_board[i][j] == 'Light' %}
                            <div class="piece white"></div>
                        {% endif %}
                    </div>
                {% endfor %}
            {% endfor %}
        </div>
        <div id="messageBox">
            <h2 id="messageBoxTitle" style="margin: 0 0 10px 0;">Game Log</h2>
            <p id="messageBoxContent" style="border-top: 1px solid black; border-bottom: 1px solid black; margin: 0; padding: 16px 0 16px 0; flex-grow: 1;"></p>
            <div id="ai_opponent_div">
                <input id="ai_opponent_checkbox" type="checkbox" onchange="toggleAIOpponent()">
                <label id="ai_opponent_lbl" for="ai_opponent_checkbox">AI Opponent</label>
            </div>
        </div>
    </div>

    <div id="utility_buttons">
        <button id="saveBtn" onclick="saveGameBoard('/send_game_state_to_user')">Save</button>
        <label id="loadBtn" for="fileInput">Load</label>
        <input type="file" id="fileInput" onchange="loadGameBoard()">
        <button id="resetBtn" onclick="resetBoard('/reset_board')">Reset</button>
    </div>
</body>
</html>
