
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Othello Board</title>
    <style>
        html * {
            font-family: "Arial";
        }
        body {
            display: flex;
            flex-direction: column; /* Stack Title and Game Area vertically */
            align-items: center; /* Center everything horizontally */
            min-height: 100vh; /* Use full viewport height */
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center; /* Vertically align items in the middle */
            height: 70vh; /* Full height of the viewport */
        }
        .board_grid {
            display: grid;
            grid-template-columns: repeat({{game_board|length}}, 60px);
            grid-template-rows: repeat({{game_board|length}}, 60px);
            gap: 2px;
            background: #006400;
            padding: 10px;
            width: fit-content;
            margin: 0 40px 0 0;
            border-radius: 10px
        }
        .cell {
            width: 60px;
            height: 60px;
            background: #228B22;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .cell:hover {
            background: #dd0712;
        } 
        .piece {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        .black {
            background: #222;
        }
        .white {
            background: #fff;
            border: 1px solid #222;
        }
        #messageBox{
            display: flex; /* Make it a flex container to align its own children */
            flex-direction: column; /* Stack log items vertically */
            width: 300px; /* Use a fixed width for the log box for predictable size */
            /* Log Box Styling */
            border: 1px solid black; 
            padding: 10px; 
            border-radius: 15px;
            /* Flexbox Property for height matching */
            align-self: stretch; /* This forces it to match the height of the board_grid */
            /* Log specific properties */
            overflow-y: auto; 
            /* The height: 10em; and line-height: 1em; were making it too small. Remove them. */
            margin: 0;
        }
        #game_area {
            display: flex;
            justify-content: center; /* Horizontally center the board/log group */
            align-items: center; /* Vertically center the board/log group in the viewport */
            height: 70vh; /* Set the height of the entire game area */
        }
    </style>
    <script>
        //Get the board that is passed from the python flask code
        let board = {{game_board|tojson}};
        //console.log(board);

        // Load the grid format once the page has loaded


        document.addEventListener('DOMContentLoaded', function() {
            loadBoard();
            updateMessageBox("It's Dark's turn.");
        }, false);

        function sendMove(x, y, url) {
            /**
            * do a GET request to the server with the x and y coordinates for the move
            * The server will respond with a JSON object containing whether the move was legal
            */

            fetch(url+'?x='+x+'&y='+y, {
                method: 'GET',
            })
            .then(response => response.json())
            .then(data => {
                // Process the response
                if (data['status'] === 'success'){
                    updateMessageBox('Valid move at (' + x + ', ' + y + ')<br>');
                    updateMessageBox("It's " + data['player'] + "'s turn.");
                    //Update the board
                    board = data['board'];
                    //Reload the board
                    loadBoard();
                }
                
                else if (data['status'] === 'fail'){
                    updateMessageBox('Illegal move at (' + x + ', ' + y + ')');
                }
                
                else if (data['status'] === 'no_legal_moves'){
                    updateMessageBox('No legal moves available for ' + data['player'] + '<br>');
                    if (data['player'] === 'Dark '){updateMessageBox("It's Lights's turn.");}
                    else{updateMessageBox("It's Darks's turn.");}
                }
                
                else if (data['finished']){
                    // Game is finished
                    // Update the board
                    board = data['board'];
                    // Reload the board
                    loadBoard();        
                    document.getElementById('messageBox').innerHTML = 'Game Over<br><br>Dark scored ' + data['scores'][1] + ' points<br>Light scored ' + data['scores'][0] + ' points<br><br>' + 
                    data['winner'] + ' is the winner!';
                }
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function loadBoard() {
            for (let y = 0; y < board.length; y++) {
                for (let x = 0; x < board[y].length; x++) {
                    let cell = document.getElementById(`cell-${x}-${y}`);
                    cell.innerHTML = ''; // Clear existing pieces
                    if (board[y][x] === 'Dark ') {
                        let piece = document.createElement('div');
                        piece.className = 'piece black';
                        cell.appendChild(piece);
                    } else if (board[y][x] === 'Light') {
                        let piece = document.createElement('div');
                        piece.className = 'piece white';
                        cell.appendChild(piece);
                    }
                }
            }
        }

        function updateMessageBox(message) {
            let messageBox = document.getElementById('messageBox');
            messageBox.innerHTML += message + '<br>';
            messageBox.scrollTop = messageBox.scrollHeight; // Auto-scroll to the bottom
        }
    </script>
</head>
<body>
    <div id="title">
        <h1 style="text-align:center;">Othello(Reversi) Game</h1>
    </div>
    
    <div id="game_area">
        <div class="board_grid">
            {% for i in range(game_board|length) %}
                {% for j in range(game_board|length) %}
                    <div class="cell" id = "cell-{{ j }}-{{ i }}" onclick="sendMove({{ j+1 }}, {{ i+1 }}, '/move')">
                        {% if game_board[i][j] == 'Dark ' %}
                            <div class="piece black"></div>
                        {% elif game_board[i][j] == 'Light' %}
                            <div class="piece white"></div>
                        {% endif %}
                    </div>
                {% endfor %}
            {% endfor %}
        </div>
        <div id="messageBox">
            <h2>Game Log:</h2>
        </div>
    </div>

    <div id="utility_buttons">

    </div>
</body>
</html>
